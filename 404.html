<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Government Portal</title>
  <meta name="description" content="The requested government service or page could not be located. Return to the home portal.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/pages.css">
</head>
<body style="min-height: 100vh; margin: 0; background: var(--bg-surface); display: flex; flex-direction: column;">

  <!-- Government Portal Premium Split Preloader -->
  <div class="gov-preloader" id="gov-preloader" aria-hidden="true">
    <!-- Two Equal Halves (Split Screen Shutter) -->
    <div class="preloader-half preloader-half-left"></div>
    <div class="preloader-half preloader-half-right"></div>

    <!-- Centered Stackly Logo & Slogan Content -->
    <div class="preloader-center">
      <div class="preloader-logo-box">
        <img src="Assets/stackly_logo_clean.webp" alt="Stackly Government Portal" class="preloader-logo">
      </div>
      <p class="preloader-slogan">Citizen First For a Stronger Nation</p>
      <div class="preloader-progress-track">
        <div class="preloader-progress-fill"></div>
      </div>
    </div>
  </div>

  <main style="flex: 1; display: flex; align-items: center; justify-content: center; width: 100%;">
    <section class="page-404-section" style="width: 100%; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 40px 16px; box-sizing: border-box;">
      <div class="container" style="display: flex; justify-content: center;">
        <div class="card-404-container" style="background-image: url('Assets/404-illustration.webp');">
          <div class="card-404-content">
            <div style="margin-bottom: 20px;">
              <a href="index.html" title="Government Portal Home">
                <img src="Assets/stackly_logo_clean.webp" alt="Stackly Government Portal" style="height: 44px; width: auto; object-fit: contain;">
              </a>
            </div>
            <div class="error-number">404</div>
            <h1 class="error-title">Page Not Found</h1>
            <p class="error-desc">
              The page you are looking for doesn't exist, has been archived, or may be currently undergoing scheduled governance updates.
            </p>
            <div class="card-404-actions">
              <a href="index.html" class="btn-gov-primary btn-gov-lg">
                <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                <span>Back to Home</span>
              </a>
              <button type="button" onclick="if (window.history.length > 1) { window.history.back(); } else { window.location.href = 'index.html'; }" class="btn-gov-secondary btn-gov-lg" style="cursor: pointer; border: 1.5px solid var(--border-medium);">
                <span>Go Back</span>
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <script src="js/main.js"></script>
</body>
</html>
