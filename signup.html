<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up &bull; Create Account | Government Portal</title>
  <meta name="description" content="Register for an official citizen or government officer account to access digital public services.">
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page-body">

  <!-- Government Portal Premium Split Preloader -->
  <div class="gov-preloader" id="gov-preloader" aria-hidden="true">
    <!-- Two Equal Halves (Split Screen Shutter) -->
    <div class="preloader-half preloader-half-left"></div>
    <div class="preloader-half preloader-half-right"></div>

    <!-- Centered Stackly Logo & Slogan Content -->
    <div class="preloader-center">
      <div class="preloader-logo-box">
        <img src="Assets/stackly_logo_clean.webp" alt="Stackly Government Portal" class="preloader-logo">
      </div>
      <p class="preloader-slogan">Citizen First For a Stronger Nation</p>
      <div class="preloader-progress-track">
        <div class="preloader-progress-fill"></div>
      </div>
    </div>
  </div>

  <!-- Full-Screen Edge-to-Edge Split Layout (No Navbar) -->
  <main class="auth-split-screen">
    
    <!-- LEFT SIDE: Full-height Real Image (No Green Tint / Overlay) -->
    <div class="auth-visual-side">
      <img src="Assets/citizen-service.webp" alt="Citizen Service Center Operations" class="auth-visual-img">
    </div>

    <!-- RIGHT SIDE: Registration Details -->
    <div class="auth-form-side">
      <div class="auth-form-inner">

        <!-- Back to Home Button (Positioned directly above Stackly Logo) -->
        <div class="auth-back-nav">
          <a href="index.html" class="auth-back-btn">
            <span>Back to Home</span>
          </a>
        </div>

        <!-- Stackly Official Brand Logo -->
        <div class="auth-brand-logo">
          <a href="index.html" class="auth-brand-link" title="Government Portal Home" style="display: inline-block;">
            <img src="Assets/stackly_logo_clean.webp" alt="Stackly Government Logo" style="height: 48px; width: auto; max-width: 175px; object-fit: contain; cursor: pointer;">
          </a>
        </div>

        <!-- Header -->
        <div class="auth-form-header">
          <h1>Create an Account</h1>
          <p>Register your details below to access government services.</p>
        </div>

        <!-- Alert Notification (Error / Success) -->
        <div id="auth-alert-box" class="auth-alert"></div>

        <!-- Sign Up Form -->
        <form id="gov-signup-form" novalidate>
          
          <!-- Hidden Input for Default Citizen Role -->
          <input type="hidden" id="signup-role" name="role" value="Citizen">

          <!-- Full Name Field -->
          <div class="auth-form-group">
            <label class="form-label" for="signup-name">Full Name *</label>
            <div class="auth-input-wrapper">
              <svg class="auth-input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
              <input type="text" id="signup-name" class="auth-input" required placeholder="Enter the name" value="" autocomplete="name">
            </div>
            <div id="signup-name-error" class="input-inline-error"></div>
          </div>

          <!-- Email (Mail) Field -->
          <div class="auth-form-group">
            <label class="form-label" for="signup-email">Email Address *</label>
            <div class="auth-input-wrapper">
              <svg class="auth-input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
              <input type="email" id="signup-email" class="auth-input" required placeholder="Enter the email address" value="" autocomplete="email">
            </div>
            <div id="signup-email-error" class="input-inline-error"></div>
          </div>

          <!-- Create Password & Confirm Password Row -->
          <div class="auth-form-row">
            <!-- Create Password -->
            <div class="auth-form-group">
              <label class="form-label" for="signup-password">Create Password *</label>
              <div class="auth-input-wrapper">
                <svg class="auth-input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="signup-password" class="auth-input" required placeholder="Enter at least 8 characters" value="" autocomplete="new-password">
                <button type="button" class="auth-toggle-password" data-target="signup-password" aria-label="Toggle password visibility">
                  <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <div id="signup-password-error" class="input-inline-error"></div>
            </div>

            <!-- Confirm Password -->
            <div class="auth-form-group">
              <label class="form-label" for="signup-confirm-password">Confirm Password *</label>
              <div class="auth-input-wrapper">
                <svg class="auth-input-icon" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="signup-confirm-password" class="auth-input" required placeholder="Enter at least 8 characters" value="" autocomplete="new-password">
                <button type="button" class="auth-toggle-password" data-target="signup-confirm-password" aria-label="Toggle confirm password visibility">
                  <svg width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                </button>
              </div>
              <div id="signup-confirm-error" class="input-inline-error"></div>
              <div id="password-match-hint" class="password-match-hint"></div>
            </div>
          </div>

          <!-- Terms Checkbox -->
          <div style="margin-bottom: 20px; font-size: 0.84rem;">
            <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer; color: var(--text-soft); line-height: 1.4;">
              <input type="checkbox" id="signup-terms" checked required style="accent-color: var(--primary); margin-top: 2px;">
              <span>I agree to the Government Portal <a href="#" style="color: var(--primary); font-weight: 600; text-decoration: none;">Terms of Service</a> and <a href="#" style="color: var(--primary); font-weight: 600; text-decoration: none;">Privacy Policy</a>.</span>
            </label>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-gov-primary btn-gov-lg" style="width: 100%;">
            <span>Create Account &bull; Register</span>
          </button>
        </form>

        <!-- Down Side: Back to Sign In -->
        <div class="auth-bottom-switch">
          <span>Already have an account?</span>
          <a href="login.html" class="auth-bottom-link">Sign in</a>
        </div>

        <div class="auth-security-badge">
          <svg width="14" height="14" fill="none" stroke="#16A34A" stroke-width="2" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
          <span>Official 256-Bit SSL Encrypted Government Services Gateway</span>
        </div>

      </div>
    </div>

  </main>

  <script src="js/main.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
